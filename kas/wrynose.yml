header:
  version: 14

machine: raspberrypi4-64
distro: poky
target:
  - core-image-picam

repos:
  smart-camera-stream:
    path: .
    layers:
      meta-picam: null

  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    layers:
      bitbake: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta: null

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky: null
      meta-yocto-bsp: null

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    layers:
      meta-oe: null
      meta-python: null
      meta-multimedia: null
      meta-networking: null

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

local_conf_header:
  smart-camera-stream: |
    BB_STRICT_CHECKSUM = "0"
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    MACHINE = "raspberrypi4-64"
    export CCACHE_PERMISSIONS_CHECK_BYPASS = "1"
    INHERIT += "ccache"
    DL_DIR = "/downloads"
    CCACHE_TOPDIR = "/ccache"
    export CCACHE_DIR = "/ccache"
    BB_NUMBER_THREADS = "4"
    PARALLEL_MAKE = "-j 4"
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    IMAGE_FEATURES += "ssh-server-openssh"
    EXTRA_IMAGE_FEATURES += "allow-empty-password allow-root-login empty-root-password post-install-logging"
    LICENSE_FLAGS_ACCEPTED = "commercial synaptics-killswitch"
    INHERIT += "rm_work"
    RM_WORK_EXCLUDE += "pir-mqtt"
