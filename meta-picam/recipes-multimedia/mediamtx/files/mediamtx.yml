# --- RTSP (Keep this on for pir-mqtt backend) ---
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554

# --- WebRTC (Turn this on for real-time web viewing) ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no      # Set to yes if accessing outside your local home LAN
webrtcICEServers:
    - "stun:stun.l.google.com:19302"

# --- Everything else off to save RAM/CPU ---
rtmp: no
hls: no
srt: no

# --- Paths ---
paths:
  cam:
    # pir_mqtt captures, annotates, and hardware-encodes the stream, then publishes it here.
    source: publisher
