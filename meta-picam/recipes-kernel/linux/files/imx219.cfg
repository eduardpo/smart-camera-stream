# --- Existing Configs ---
CONFIG_VIDEO_IMX219=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_V4L2_FWNODE=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_I2C_CHARDEV=y

# 1. Enable the DMA Heaps (Required for libcamera to see the Pi)
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
CONFIG_DMABUF_HEAPS_CMA=y

# 2. Enable the Unicam driver (The hardware bridge for the camera)
CONFIG_VIDEO_BCM2835_UNICAM=y

# 3. Enable the Pi ISP (Image Signal Processor)
CONFIG_VIDEO_BCM2835_ISP=y

# 4. Ensure CMA is active in the kernel
CONFIG_CMA=y
CONFIG_DMA_CMA=y
